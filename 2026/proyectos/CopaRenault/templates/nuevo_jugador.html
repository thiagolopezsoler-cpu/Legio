<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo jugador - Copa Renault</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Copa Renault</h1>
        <p>Agregar jugador</p>
    </header>

    <main>

        <h2>Nuevo jugador</h2>

        <form method="POST" action="/admin/jugador/nuevo">

            <label for="Nombre">Nombre</label>
            <input type="text" id="Nombre" name="Nombre" required>

            <label for="DNI">DNI</label>
            <input type="text" id="DNI" name="DNI" required>

            <label for="Telefono">Teléfono</label>
            <input type="text" id="Telefono" name="Telefono">

            <label for="Email">Email</label>
            <input type="email" id="Email" name="Email">

            <label for="Fecha_nacimiento">Fecha de nacimiento</label>
            <input type="date" id="Fecha_nacimiento" name="Fecha_nacimiento">

            <label for="Comida_especial">Comida especial</label>

            <select id="Comida_especial" name="Comida_especial">
                <option value="N">No</option>
                <option value="S">Sí</option>
            </select>

            <label for="id_equipo">Equipo</label>

            <select id="id_equipo" name="id_equipo" required>

                {% for equipo in equipos %}

                    <option value="{{ equipo.id_equipo }}">
                        {{ equipo.Colegio }} - {{ equipo.Deporte }} - {{ equipo.Categoria }}
                    </option>

                {% endfor %}

            </select>

            <button type="submit">Guardar jugador</button>

        </form>

        <br>

        <a href="/admin/jugadores">Volver a jugadores</a>

    </main>

</body>

</html>
