<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entradas - Copa Renault</title>
</head>

<body>

    <h1>Copa Renault</h1>

    <h2>Comprar entrada</h2>

    <form method="POST" action="/comprar-entrada">

        <label for="tipo">Tipo de entrada:</label>

        <select id="tipo" name="tipo" required>
            <option value="General">General - $5000</option>
            <option value="Estudiante">Estudiante - $3000</option>
        </select>

        <br><br>

        <button type="submit">Comprar entrada</button>

    </form>

    <br>

    <a href="/">Volver al inicio</a>

</body>

</html>
