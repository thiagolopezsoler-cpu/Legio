{% extends "base.html" %}

{% block contenido %}

<section class="pagina">

    <h1>Mis materias</h1>

    {% if materias %}

        <div class="grid">

            {% for materia in materias %}

                <div class="tarjeta">

                    <h2>{{ materia.nombre }}</h2>

                    <p>{{ materia.descripcion }}</p>

                    <a
                        href="{{ url_for('materia', materia_id=materia.id) }}"
                        class="boton"
                    >
                        Entrar
                    </a>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <p>No estas inscripto en ninguna materia.</p>

    {% endif %}

</section>

{% endblock %}
